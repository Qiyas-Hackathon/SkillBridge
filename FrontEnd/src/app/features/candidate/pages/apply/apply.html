<div class="apply-page">

    <a
      [routerLink]="job() ? ['/candidate/jobs', job()!.id] : ['/candidate/jobs']"
      class="cancel-button">
      ← Cancel
    </a>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    @if (notice()) {
      <p class="notice-banner">{{ notice() }}</p>
    }
  
  
      <header class="page-header">
        <h1>Apply for Job</h1>
        <p>Complete the form below to submit your application.</p>
      </header>
  
      <section class="job-summary">
  
        <h2>{{ job()?.title }}</h2>
  
        <p>{{ job()?.companyName }}</p>
  
      </section>
  
      <form
        class="application-form"
        (ngSubmit)="submitApplication()">
  
        <div class="form-group">
  
          <label for="fullName">
            Full Name
          </label>
  
          <input
            id="fullName"
            type="text"
            name="fullName"
            [(ngModel)]="application.fullName"
            required>
  
        </div>
  
        <div class="form-group">
  
          <label for="email">
            Email
          </label>
  
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="application.email"
            required>
  
        </div>
  
        <div class="form-group">
  
          <label for="phone">
            Phone Number
          </label>
  
          <input
            id="phone"
            type="tel"
            name="phone"
            [(ngModel)]="application.phone">
  
        </div>
  
        <div class="form-group">
  
          <label for="coverLetter">
            Cover Letter
          </label>
  
          <textarea
            id="coverLetter"
            name="coverLetter"
            [(ngModel)]="application.coverLetter"
            placeholder="Write your cover letter..."
            required>
          </textarea>
  
        </div>
  
        <div class="form-group">
  
          <label for="portfolioUrl">
            Portfolio URL
          </label>
  
          <input
            id="portfolioUrl"
            type="url"
            name="portfolioUrl"
            [(ngModel)]="application.portfolioUrl"
            placeholder="https://example.com">
  
        </div>
  
        <div class="form-group">
  
          <label for="resume">
            Resume
          </label>
  
          <input
            id="resume"
            type="text"
            name="resume"
            [(ngModel)]="application.resume"
            placeholder="Resume file name">
  
        </div>
  
        <button
          type="submit"
          class="submit-button">
          Submit Application
        </button>
  
      </form>
  
  </div>
