<form [formGroup]="form" (ngSubmit)="submit()">
  @if (error) {
    <p class="form-error">{{ error }}</p>
  }

  <label>Title
    <input formControlName="title" placeholder="e.g. Junior Angular Developer" />
    @if (invalid('title')) { <small>Title is required (max 200 characters)</small> }
  </label>

  <label>Description
    <textarea rows="6" formControlName="description"></textarea>
    @if (invalid('description')) { <small>Description is required (max 5000 characters)</small> }
  </label>

  <fieldset class="skills">
    <legend>Required skills</legend>

    <div class="chips">
      @for (skill of catalogue(); track skill.id) {
        <label class="chip" [class.on]="isSelected(skill.id)">
          <input
            type="checkbox"
            [checked]="isSelected(skill.id)"
            (change)="toggleSkill(skill.id)" />
          {{ skill.name }}
        </label>
      } @empty {
        <span class="hint">No skills in the catalogue yet. Add the first one below.</span>
      }
    </div>

    @if (skillsTouched() && selected().size === 0) {
      <small>Select at least one skill</small>
    }

    <div class="add-skill">
      <input
        type="text"
        [value]="newSkill"
        (input)="newSkill = $any($event.target).value"
        (keydown.enter)="$event.preventDefault(); addNewSkill()"
        placeholder="Skill not listed? Type it here" />
      <button type="button" (click)="addNewSkill()">Add skill</button>
    </div>

    @if (skillError()) {
      <small>{{ skillError() }}</small>
    }
  </fieldset>

  <button type="submit" [disabled]="saving">
    {{ saving ? 'Saving...' : editing ? 'Save changes' : 'Post job' }}
  </button>
</form>
